server {
    listen 0.0.0.0:7860;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This submission is a static, scripted demo. It has no model/API server.
    location = /api { return 404; }
    location /api/ { return 404; }

    location = / {
        if ($arg_demo != judge) { return 302 /?demo=judge; }
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
