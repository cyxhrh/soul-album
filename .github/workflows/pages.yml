name: Deploy frontend demo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git ref to publish (submission branch or commit)'
        required: true
        default: main
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # The frontend uses the bundled browser WASM runtime, not onnxruntime-node's
      # native postinstall binary.
      - run: npm ci --ignore-scripts
      - run: npm run test
      - run: npm run lint
      - run: npm run build -- --base=/soul-album/
        env:
          VITE_JUDGE_DEMO: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
